<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | AuAu Control</title>

    <link rel="icon" href="../assets/img/icon.ico" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>

<body class="d-md-flex min-vh-100 bg-body-tertiary" data-page="clientes" data-path-base="../">
    <aside id="sidebar"></aside>

    <div class="flex-grow-1 d-flex flex-column overflow-x-auto">
        <main class="flex-grow-1 p-4 p-lg-5">
            <header class="mb-4">
                <h1 class="fw-bold text-primary">Clientes</h1>
                <p class="text-body-secondary mb-0">Cadastre novos clientes e consulte, altere ou remova os que já estão no sistema.</p>
            </header>

            <div class="alert alert-success border-0 border-start border-4 border-success shadow fade position-fixed top-0 end-0 m-3 z-3" id="message" role="status" hidden></div>

            <section class="card card-body shadow-sm mb-4">
                <h2 class="card-title fs-5 fw-bold mb-3" data-texto-edicao="Alterar cliente">Novo cliente</h2>

                <form id="form-cliente" class="row g-3" novalidate>
                    <input type="text" name="id" id="id" hidden>

                    <p class="col-12 small text-body-secondary mb-0">Campos com <span class="text-danger">*</span> são obrigatórios.</p>

                    <div class="col-12">
                        <label class="form-label fw-semibold" for="nome">Nome completo <span class="text-danger" aria-hidden="true">*</span></label>
                        <input class="form-control" type="text" name="nome" id="nome" placeholder="Fulano da Silva" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="telefone">Telefone</label>
                        <input class="form-control" type="tel" id="telefone" name="telefone" placeholder="(44) 9 1234-5678">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="email">E-mail</label>
                        <input class="form-control" type="email" id="email" name="email" placeholder="fulano@gmail.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="rg">RG</label>
                        <input class="form-control" type="text" inputmode="numeric" id="rg" name="rg" placeholder="12.345.678-9">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="cpf">CPF <span class="text-danger" aria-hidden="true">*</span></label>
                        <input class="form-control" type="text" inputmode="numeric" id="cpf" name="cpf" placeholder="123.456.789-01" required>
                    </div>

                    <div class="col-12 d-flex flex-column flex-sm-row gap-2">
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold" data-texto-edicao="Salvar alterações">Salvar cliente</button>
                        <button type="reset" class="btn btn-outline-primary rounded-pill px-4 fw-bold" data-texto-edicao="Cancelar">Limpar campos</button>
                    </div>
                </form>
            </section>

            <section class="card card-body shadow-sm mb-4">
                <h2 class="card-title fs-5 fw-bold mb-3">Clientes cadastrados</h2>

                <form role="search">
                    <div class="d-flex flex-column flex-sm-row gap-2 gap-sm-3 mb-3">
                        <input class="form-control" type="text" name="busca" id="busca" placeholder="Buscar por nome ou CPF" aria-label="Buscar por nome ou CPF">
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="text-primary">Nº</th>
                                <th class="text-primary">Nome</th>
                                <th class="text-primary">Telefone</th>
                                <th class="text-primary">E-mail</th>
                                <th class="text-primary">CPF</th>
                                <th class="text-primary"><span class="visually-hidden">Ações</span></th>
                            </tr>
                        </thead>
                        <tbody class="table-group-divider" id="table-clientes"></tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer class="px-4 px-lg-5 py-3 border-top small text-body-secondary">
            <p>
                Desenvolvido por Pedro Watermann
                <a href="https://www.linkedin.com/in/pedrowatermann" target="_blank" rel="noopener">
                    <img src="../assets/img/LinkedinLogo.png" width="20" height="20" class="align-text-bottom" alt="LinkedIn de Pedro Watermann">
                </a>
                e Vinicius Del Cielo
                <a href="https://www.linkedin.com/in/vin%C3%ADcius-garcia-540246367" target="_blank" rel="noopener">
                    <img src="../assets/img/LinkedinLogo.png" width="20" height="20" class="align-text-bottom" alt="LinkedIn de Vinicius Del Cielo">
                </a>
            </p>
        </footer>
    </div>

    <script src="../src/utils/validacoes.js"></script>
    <script src="../src/utils/formatadores.js"></script>
    <script src="../src/services/storage.js"></script>
    <script src="../src/views/LayoutView.js"></script>
    <script src="../src/views/FormularioView.js"></script>
    <script src="../src/views/ModalView.js"></script>
    <script src="../src/models/Cliente.js"></script>
    <script src="../src/views/ClienteView.js"></script>
    <script src="../src/controllers/ClienteController.js"></script>
</body>

</html>
