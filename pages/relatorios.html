<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios | AuAu Control</title>

    <link rel="icon" href="../assets/img/icon.ico" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>

<body data-page="relatorios" data-path-base="../">
    <aside id="sidebar"></aside>

    <main>
        <header class="mb-4">
            <h1 class="fw-bold">Relatórios</h1>
            <p id="relatorio-resumo" class="text-body-secondary mb-0">Escolha qual relatório deseja visualizar.</p>
        </header>

        <section class="card card-body shadow-sm mb-4">
            <form id="form-relatorio" class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="tipo-relatorio">Tipo de relatório</label>
                    <select class="form-select" id="tipo-relatorio" name="tipo">
                        <option value="clientes" selected>Clientes</option>
                        <option value="funcionarios">Funcionários</option>
                        <option value="animais">Animais</option>
                        <option value="atendimentos">Atendimentos</option>
                    </select>
                </div>

                <div class="col-md-6 d-flex justify-content-md-end">
                    <button type="button" class="btn btn-outline-primary rounded-pill px-4 fw-bold" id="btn-imprimir">Imprimir relatório</button>
                </div>
            </form>
        </section>

        <section class="card card-body shadow-sm mb-4">
            <h2 id="relatorio-titulo" class="card-title fs-5 fw-bold mb-3">Relatório de clientes</h2>

            <table class="table align-middle mb-0">
                <thead id="relatorio-cabecalho"></thead>
                <tbody class="table-group-divider" id="relatorio-corpo"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>
            Desenvolvido por Pedro Watermann
            <a href="https://www.linkedin.com/in/pedrowatermann" target="_blank" rel="noopener">
                <img src="../assets/img/LinkedinLogo.png" alt="LinkedIn de Pedro Watermann">
            </a>
            e Vinicius Del Cielo
            <a href="https://www.linkedin.com/in/vin%C3%ADcius-garcia-540246367" target="_blank" rel="noopener">
                <img src="../assets/img/LinkedinLogo.png" alt="LinkedIn de Vinicius Del Cielo">
            </a>
        </p>
    </footer>

    <script src="../src/utils/formatadores.js"></script>
    <script src="../src/services/storage.js"></script>
    <script src="../src/views/LayoutView.js"></script>
    <script src="../src/models/Cliente.js"></script>
    <script src="../src/models/Funcionario.js"></script>
    <script src="../src/models/Animal.js"></script>
    <script src="../src/models/Atendimento.js"></script>
    <script src="../src/views/RelatorioView.js"></script>
    <script src="../src/controllers/RelatorioController.js"></script>
</body>

</html>
